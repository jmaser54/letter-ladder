<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Letter Ladder</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #1B2A41;
    --bg-panel: #24384F;
    --rung: #F5EFE0;
    --rung-empty: rgba(245,239,224,0.08);
    --ink: #F5EFE0;
    --ink-dim: #9FB3C8;
    --amber: #E8A33D;
    --red: #D9705F;
    --green: #6FBF8B;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background: radial-gradient(120% 140% at 50% -10%, #24384F 0%, #1B2A41 55%, #142132 100%);
    color: var(--ink);
    font-family: 'Inter', system-ui, sans-serif;
    min-height:100vh;
    padding: 32px 16px 80px;
  }
  .wrap{ max-width: 560px; margin: 0 auto; }

  header{ text-align:center; margin-bottom: 22px; }
  .brand{
    font-family:'Fraunces', serif;
    font-weight:700;
    font-size: 2.4rem;
    letter-spacing: -0.01em;
    margin: 0;
  }
  .brand .rung-i{ color: var(--amber); }
  .tagline{ color: var(--ink-dim); font-size: 0.95rem; margin-top: 4px; }
  .top-links{
    display:flex; justify-content:center; gap:18px; margin-top:10px; font-size: 0.85rem;
  }
  .top-links a{ color: var(--ink-dim); text-decoration:none; border-bottom: 1px dotted var(--ink-dim); }
  .top-links a:hover{ color: var(--amber); border-color: var(--amber); }

  .date-row{
    text-align:center; color: var(--ink-dim); font-size: 0.85rem; margin-bottom: 18px;
    letter-spacing: 0.03em; text-transform: uppercase;
  }

  .tabs{
    display:flex; background: rgba(0,0,0,0.2); border-radius: 999px; padding: 4px; margin-bottom: 28px;
  }
  .tab{
    flex:1; text-align:center; padding: 10px 0; border-radius: 999px; cursor:pointer;
    font-weight:600; font-size:0.92rem; color: var(--ink-dim); transition: all 0.15s ease;
    user-select:none;
  }
  .tab.active{ background: var(--amber); color: #1B2A41; }
  .tab .dot{ display:none; }

  .panel{
    background: var(--bg-panel);
    border-radius: 18px;
    padding: 28px 24px 26px;
    box-shadow: 0 20px 50px rgba(0,0,0,0.35);
  }

  .level-label{
    text-align:center; font-size:0.78rem; text-transform:uppercase; letter-spacing:0.12em;
    color: var(--amber); font-weight:700; margin-bottom: 18px;
  }

  .ladder{ display:flex; flex-direction:column-reverse; align-items:center; gap:10px; }
  .rung-row{ display:flex; align-items:center; gap:12px; width:100%; justify-content:center; }
  .rung-count{ width: 22px; text-align:right; color: var(--ink-dim); font-size: 0.75rem; font-variant-numeric: tabular-nums; }
  .rung{
    font-family:'Fraunces', serif;
    font-size: 1.35rem;
    font-weight:600;
    letter-spacing: 0.06em;
    background: var(--rung);
    color: #1B2A41;
    padding: 10px 18px;
    border-radius: 10px;
    min-width: 140px;
    text-align:center;
    text-transform: uppercase;
  }
  .rung.empty{
    background: var(--rung-empty);
    color: var(--ink-dim);
    border: 1.5px dashed rgba(245,239,224,0.25);
  }
  .rung.anchor{ background: var(--amber); }

  form.guess-form{ display:flex; gap:10px; margin-top: 22px; }
  input[type=text]{
    flex:1; font-size: 1.05rem; padding: 12px 14px; border-radius: 10px; border: none;
    background: rgba(245,239,224,0.1); color: var(--ink); font-family:'Inter',sans-serif;
    outline: none;
  }
  input[type=text]:focus{ box-shadow: 0 0 0 2px var(--amber); }
  input[type=text]::placeholder{ color: var(--ink-dim); }

  button{
    font-family:'Inter',sans-serif; font-weight:600; font-size:0.95rem;
    border:none; border-radius:10px; cursor:pointer; padding: 12px 18px;
    transition: transform 0.1s ease, filter 0.1s ease;
  }
  button:hover{ filter: brightness(1.08); }
  button:active{ transform: scale(0.97); }
  .btn-primary{ background: var(--amber); color:#1B2A41; }
  .btn-ghost{ background: rgba(245,239,224,0.08); color: var(--ink); }

  .feedback{ margin-top:18px; text-align:center; font-weight:600; min-height: 24px; }
  .feedback.win{ color: var(--green); }
  .feedback.error{ color: var(--red); }
  .feedback.ok{ color: var(--ink-dim); font-weight:500; }
  .details{ margin-top:6px; text-align:center; font-size:0.85rem; color: var(--red); font-style:italic; }

  .actions-row{ display:flex; justify-content:center; margin-top:18px; }

  .empty-state{ text-align:center; color: var(--ink-dim); padding: 30px 0; }

  footer{ text-align:center; margin-top: 30px; color: var(--ink-dim); font-size: 0.8rem; }

  @media (max-width: 420px){
    .rung{ font-size: 1.1rem; min-width: 110px; padding: 9px 12px; }
    .brand{ font-size: 2rem; }
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1 class="brand">Letter Ladder</h1>
    <div class="tagline">Add one letter, scramble to a new word, climb to the top.</div>
    <div class="top-links">
      <a href="about.html">How to play</a>
      <a href="about.html#about">About</a>
    </div>
  </header>

  <div class="date-row" id="date-row"></div>

  <div class="tabs" id="tabs">
    <div class="tab" data-tier="easy">Easy</div>
    <div class="tab" data-tier="medium">Medium</div>
    <div class="tab" data-tier="hard">Hard</div>
  </div>

  <div class="panel" id="panel">
    <!-- filled by JS -->
  </div>

  <footer>
    Dictionary courtesy of the <a href="https://github.com/dwyl/english-words" target="_blank" style="color:var(--ink-dim)">dwyl/english-words</a> project on GitHub.
  </footer>
</div>

<script src="data/words.js"></script>
<script src="data/puzzles.js"></script>
<script>
// ---------- date helpers ----------
function todayKey(){
  const d = new Date();
  const y = d.getFullYear();
  const m = String(d.getMonth()+1).padStart(2,'0');
  const day = String(d.getDate()).padStart(2,'0');
  return `${y}-${m}-${day}`;
}
function prettyDate(key){
  const [y,m,d] = key.split('-').map(Number);
  const dt = new Date(y, m-1, d);
  return dt.toLocaleDateString(undefined, { weekday:'long', month:'long', day:'numeric' });
}

// ---------- game logic (ported from the original Flask app.py) ----------
function counter(str){
  const c = {};
  for(const ch of str) c[ch] = (c[ch]||0)+1;
  return c;
}
function isValidGuess(guess, startingWord, finalWord){
  const startingLetters = new Set(startingWord);
  for(const ch of startingLetters){
    if(!guess.includes(ch)) return false;
  }
  const guessCounter = counter(guess);
  const finalCounter = counter(finalWord);
  for(const ch of guess){
    if((guessCounter[ch]||0) > (finalCounter[ch]||0)) return false;
  }
  return true;
}
function isStepValid(word1, word2){
  if(word2.length !== word1.length + 1) return false;
  const temp = word2.split('');
  for(const ch of word1){
    const idx = temp.indexOf(ch);
    if(idx === -1) return false;
    temp.splice(idx,1);
  }
  return true;
}
function isValidChain(startingWord, guessesObj, finalWord){
  const lengths = Object.keys(guessesObj).map(Number).sort((a,b)=>a-b);
  const allWords = [startingWord, ...lengths.map(l => guessesObj[l]), finalWord];
  const invalidSteps = [];
  for(let i=0;i<allWords.length-1;i++){
    if(!isStepValid(allWords[i], allWords[i+1])){
      invalidSteps.push([allWords[i], allWords[i+1]]);
    }
  }
  return { valid: invalidSteps.length === 0, invalidSteps };
}

// ---------- state ----------
const TIERS = ['easy','medium','hard'];
let activeTier = 'easy';
const dateKey = todayKey();

function storageKey(tier){ return `letterladder:${dateKey}:${tier}`; }
function loadGuesses(tier){
  try{
    const raw = localStorage.getItem(storageKey(tier));
    return raw ? JSON.parse(raw) : {};
  }catch(e){ return {}; }
}
function saveGuesses(tier, obj){
  try{ localStorage.setItem(storageKey(tier), JSON.stringify(obj)); }catch(e){}
}
function clearGuesses(tier){
  try{ localStorage.removeItem(storageKey(tier)); }catch(e){}
}

// ---------- rendering ----------
const panel = document.getElementById('panel');
document.getElementById('date-row').textContent = prettyDate(dateKey);

function getTodaysPuzzle(tier){
  const day = PUZZLE_SCHEDULE[dateKey];
  if(!day) return null;
  return day[tier] || null;
}

function render(){
  document.querySelectorAll('.tab').forEach(t=>{
    t.classList.toggle('active', t.dataset.tier === activeTier);
  });

  const puzzle = getTodaysPuzzle(activeTier);
  if(!puzzle){
    panel.innerHTML = `<div class="empty-state">No ${activeTier} puzzle scheduled for today yet — check back soon!</div>`;
    return;
  }

  const startingWord = puzzle.start;
  const finalWord = puzzle.final;
  const steps = [];
  for(let L = startingWord.length+1; L < finalWord.length; L++) steps.push(L);

  const guesses = loadGuesses(activeTier);
  const allFilled = steps.every(L => guesses[L]);
  let feedback = '';
  let feedbackClass = '';
  let details = [];

  if(allFilled){
    const { valid, invalidSteps } = isValidChain(startingWord, guesses, finalWord);
    if(valid){
      feedback = "🎉 You win! Nicely climbed.";
      feedbackClass = 'win';
    } else {
      feedback = "❌ Your guesses aren't a valid progression. Try adjusting a step.";
      feedbackClass = 'error';
      details = invalidSteps.map(([a,b]) => `${a} → ${b} isn't a valid one-letter step`);
    }
  }

  const rungsHtml = [];
  rungsHtml.push(`<div class="rung-row"><div class="rung-count">${finalWord.length}</div><div class="rung anchor">${finalWord}</div></div>`);
  for(let i = steps.length-1; i>=0; i--){
    const L = steps[i];
    const g = guesses[L];
    rungsHtml.push(`<div class="rung-row"><div class="rung-count">${L}</div><div class="rung ${g?'':'empty'}">${g ? g : '&nbsp;'.repeat(L)}</div></div>`);
  }
  rungsHtml.push(`<div class="rung-row"><div class="rung-count">${startingWord.length}</div><div class="rung anchor">${startingWord}</div></div>`);

  panel.innerHTML = `
    <div class="level-label">${activeTier} puzzle</div>
    <div class="ladder">${rungsHtml.join('')}</div>
    ${feedbackClass === 'win' ? '' : `
    <form class="guess-form" id="guess-form" autocomplete="off">
      <input type="text" id="guess-input" placeholder="Enter a word..." autofocus>
      <button type="submit" class="btn-primary">Guess</button>
    </form>`}
    <div class="feedback ${feedbackClass}">${feedback}</div>
    ${details.map(d=>`<div class="details">${d}</div>`).join('')}
    <div class="actions-row">
      <button class="btn-ghost" id="clear-btn" type="button">Clear guesses</button>
    </div>
  `;

  const form = document.getElementById('guess-form');
  if(form){
    form.addEventListener('submit', (e)=>{
      e.preventDefault();
      const input = document.getElementById('guess-input');
      const guess = input.value.replace(/\s+/g,'').toLowerCase();
      handleGuess(guess, startingWord, finalWord, steps);
    });
  }
  document.getElementById('clear-btn').addEventListener('click', ()=>{
    clearGuesses(activeTier);
    render();
  });
}

function handleGuess(guess, startingWord, finalWord, steps){
  const guesses = loadGuesses(activeTier);
  let msg = '', cls = '';

  if(!/^[a-z]+$/.test(guess)){
    msg = "Guess must be letters only."; cls = 'error';
  } else if(!WORD_SET.has(guess)){
    msg = "Not a valid English word."; cls = 'error';
  } else if(!isValidGuess(guess, startingWord, finalWord)){
    msg = "That guess uses invalid letters for this puzzle."; cls = 'error';
  } else if(!steps.includes(guess.length)){
    msg = `Guess must be one of these lengths: ${steps.join(', ')}`; cls = 'error';
  } else {
    guesses[guess.length] = guess;
    saveGuesses(activeTier, guesses);
    render();
    return;
  }

  // show a transient error without wiping the board
  const fb = document.querySelector('.feedback');
  fb.textContent = msg;
  fb.className = `feedback ${cls}`;
}

document.getElementById('tabs').addEventListener('click', (e)=>{
  const tab = e.target.closest('.tab');
  if(!tab) return;
  activeTier = tab.dataset.tier;
  render();
});

render();
</script>
</body>
</html>
