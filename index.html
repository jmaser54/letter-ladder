<meta charset="UTF-8">

<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #1B2A41;
    --bg-panel: #24384F;
    --rung: #F5EFE0;
    --rung-empty: rgba(245,239,224,0.08);
    --ink: #F5EFE0;
    --ink-dim: #9FB3C8;
    --amber: #E8A33D;
    --red: #D9705F;
    --green: #6FBF8B;
  }
  *{box-sizing:border-box;}
  html, body{ height: 100%; }
  body{
    margin:0;
    background: radial-gradient(120% 140% at 50% -10%, #24384F 0%, #1B2A41 55%, #142132 100%);
    color: var(--ink);
    font-family: 'Inter', system-ui, sans-serif;
    overflow: hidden; /* the app-shell below manages its own internal scrolling instead */
  }
  .wrap{
    max-width: 560px; margin: 0 auto;
    height: 100vh;
    height: 100dvh; /* dynamic viewport height: shrinks automatically when the
                       on-screen keyboard opens, unlike 100vh which ignores it.
                       This is the key piece that keeps the guess box and tabs
                       always on-screen and stable instead of fighting the
                       browser's own scroll-into-view behavior. */
    display: flex;
    flex-direction: column;
    padding: 20px 16px 12px;
  }

  header{ text-align:center; margin-bottom: 12px; flex-shrink:0; }
  .brand{
    font-family:'Fraunces', serif;
    font-weight:700;
    font-size: 2rem;
    letter-spacing: -0.01em;
    margin: 0;
  }
  .brand .rung-i{ color: var(--amber); }
  .tagline{ color: var(--ink-dim); font-size: 0.85rem; margin-top: 4px; }
  .top-links{
    display:flex; flex-wrap:wrap; justify-content:center; gap:8px 16px; margin-top:6px; font-size: 0.8rem;
  }
  .top-links a{ color: var(--ink-dim); text-decoration:none; border-bottom: 1px dotted var(--ink-dim); }
  .top-links a:hover{ color: var(--amber); border-color: var(--amber); }

  .date-row{
    text-align:center; color: var(--ink-dim); font-size: 0.8rem; margin-bottom: 10px;
    letter-spacing: 0.03em; text-transform: uppercase; flex-shrink:0;
  }

  .tabs{
    display:flex; background: rgba(0,0,0,0.2); border-radius: 999px; padding: 4px; margin-bottom: 14px;
    flex-shrink:0;
  }
  .tab{
    flex:1; text-align:center; padding: 9px 0; border-radius: 999px; cursor:pointer;
    font-weight:600; font-size:0.9rem; color: var(--ink-dim); transition: all 0.15s ease;
    user-select:none;
  }
  .tab.active{ background: var(--amber); color: #1B2A41; }
  .tab .dot{ display:none; }

  .panel{
    background: var(--bg-panel);
    border-radius: 18px;
    padding: 18px 18px 16px;
    box-shadow: 0 20px 50px rgba(0,0,0,0.35);
    flex: 1;
    min-height: 0; /* required so this flex child can shrink below its content
                      size and let its own inner scroll area take over,
                      instead of overflowing the page */
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  .level-label{
    text-align:center; font-size:0.75rem; text-transform:uppercase; letter-spacing:0.12em;
    color: var(--amber); font-weight:700; margin-bottom: 10px; flex-shrink:0;
  }

  .ladder-scroll{
    flex: 1;
    min-height: 0;
    overflow-y: auto;
    /* a little breathing room so the top/bottom rungs aren't flush against
       the scroll edges, and so the scrollbar doesn't sit on top of text */
    padding: 2px 2px;
  }
  .ladder{
    display:flex; flex-direction:column; align-items:center; gap: var(--rung-gap, 10px);
    position: relative;
    padding: 10px 26px;
  }
  .ladder::before, .ladder::after{
    content: "";
    position: absolute;
    top: 0; bottom: 0;
    width: 13px;
    border-radius: 7px;
    background: linear-gradient(90deg, #C97F3D, #E8A055 45%, #C97F3D);
    box-shadow: inset -2px 0 0 rgba(255,255,255,0.25), inset 2px 0 0 rgba(0,0,0,0.2), 0 2px 5px rgba(0,0,0,0.3);
  }
  .ladder::before{ left: 6px; }
  .ladder::after{ right: 6px; }

  .rung-row{
    display:flex; align-items:center; gap:12px; width:100%; justify-content:center;
    position: relative;
  }
  .rung-row::before{
    /* the actual rung: a horizontal plank spanning between the two side
       rails, sitting BEHIND the word box so it reads as one continuous
       crossbar the word is written on */
    content: "";
    position: absolute;
    left: -20px; right: -20px;
    top: 50%; transform: translateY(-50%);
    height: 13px;
    border-radius: 6px;
    background: linear-gradient(180deg, #E8A055, #C97F3D);
    box-shadow: inset 0 -2px 0 rgba(0,0,0,0.2), inset 0 2px 0 rgba(255,255,255,0.25), 0 2px 4px rgba(0,0,0,0.3);
    z-index: 0;
  }
  .rung-row > *{ position: relative; z-index: 1; }
  .rung-count{ width: 22px; text-align:right; color: var(--ink-dim); font-size: 0.75rem; font-variant-numeric: tabular-nums; }
  .rung{
    font-family:'Fraunces', serif;
    font-size: var(--rung-font, 1.35rem);
    font-weight:600;
    letter-spacing: 0.06em;
    background: var(--rung);
    color: #1B2A41;
    padding: var(--rung-pad, 10px 18px);
    border-radius: 10px;
    min-width: var(--rung-minw, 140px);
    text-align:center;
    text-transform: uppercase;
  }
  .rung.empty{
    background: var(--rung-empty);
    color: var(--ink-dim);
    border: 1.5px dashed rgba(245,239,224,0.25);
  }
  .rung.anchor{ background: var(--amber); }
  .rung.clickable{ cursor: pointer; transition: filter 0.1s ease, transform 0.1s ease; }
  .rung.clickable:hover{ filter: brightness(1.08); }
  .rung.clickable:active{ transform: scale(0.97); }
  input.rung-input{
    border: none;
    outline: none;
    box-shadow: 0 0 0 2px var(--amber);
    width: var(--rung-minw, 140px);
    box-sizing: border-box;
  }

  /* Ladders get taller the more rungs a puzzle has, so these tiers shrink
     things down automatically to keep long puzzles more compact - short
     puzzles stay at full comfortable size. Combined with the scrollable
     ladder area above, a puzzle that still doesn't fully fit (rare - only
     the longest puzzles on the smallest screens) simply scrolls within its
     own little area instead of taking over the whole page. */
  .panel.rungs-md{ --rung-font: 1.1rem; --rung-pad: 7px 12px; --rung-minw: 115px; --rung-gap: 6px; }
  .panel.rungs-lg{ --rung-font: 0.95rem; --rung-pad: 6px 10px; --rung-minw: 100px; --rung-gap: 5px; }
  .panel.rungs-xl{ --rung-font: 0.85rem; --rung-pad: 5px 8px; --rung-minw: 88px; --rung-gap: 4px; }


  button{
    font-family:'Inter',sans-serif; font-weight:600; font-size:0.95rem;
    border:none; border-radius:10px; cursor:pointer; padding: 12px 18px;
    transition: transform 0.1s ease, filter 0.1s ease;
  }
  button:hover{ filter: brightness(1.08); }
  button:active{ transform: scale(0.97); }
  .btn-primary{ background: var(--amber); color:#1B2A41; }
  .btn-ghost{ background: rgba(245,239,224,0.08); color: var(--ink); }

  .feedback{ margin-top:12px; text-align:center; font-weight:600; min-height: 24px; flex-shrink:0; }
  .feedback.win, .feedback.ok{ text-align:center; }
  .error-list{ list-style:none; margin: 12px 0 0; padding:0; text-align:left; display:inline-block; }
  .error-list li{ position:relative; padding-left:18px; margin-bottom:6px; font-weight:600; color: var(--red); font-size:0.9rem; }
  .error-list li::before{ content:"●"; color: var(--red); position:absolute; left:0; font-size:0.6rem; top:5px; }
  .error-list-wrap{ display:flex; justify-content:center; }
  .feedback.win{ color: var(--green); }
  .feedback.error{ color: var(--red); }
  .feedback.ok{ color: var(--ink-dim); font-weight:500; }
  .details{ margin-top:4px; text-align:center; font-size:0.8rem; color: var(--red); font-style:italic; }

  .actions-row{ display:flex; justify-content:center; gap:10px; margin-top:10px; flex-shrink:0; }
  .hint-display{
    text-align:center; margin-top:10px; font-size:0.85rem; color: var(--ink-dim);
    font-style:italic; flex-shrink:0; min-height: 0;
  }
  .hint-display .hint-letters{ color: var(--amber); font-style:normal; font-weight:600; letter-spacing:0.04em; }

  .empty-state{ text-align:center; color: var(--ink-dim); padding: 30px 0; }

  footer{ text-align:center; margin-top: 8px; color: var(--ink-dim); font-size: 0.7rem; flex-shrink:0; }

  @media (max-width: 420px){
    .rung{ min-width: calc(var(--rung-minw, 140px) * 0.8); }
    .brand{ font-size: 1.7rem; }
  }

  .confetti-piece{
    position: fixed;
    top: -12px;
    width: 8px;
    height: 14px;
    opacity: 0.95;
    pointer-events: none;
    z-index: 999;
    animation: confetti-fall linear forwards;
  }
  @keyframes confetti-fall{
    to{ transform: translateY(110vh) rotate(360deg); opacity: 0.4; }
  }

  .summit-banner{
    position: fixed;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    background: var(--bg-panel);
    color: var(--amber);
    padding: 22px 28px;
    border-radius: 16px;
    box-shadow: 0 20px 60px rgba(0,0,0,0.5);
    text-align: center;
    font-family: 'Fraunces', serif;
    font-weight: 700;
    font-size: 1.15rem;
    z-index: 1000;
    max-width: 320px;
    animation: summit-pop 0.3s ease;
  }
  @keyframes summit-pop{
    from{ transform: translate(-50%, -50%) scale(0.85); opacity: 0; }
    to{ transform: translate(-50%, -50%) scale(1); opacity: 1; }
  }
</style>

<body>
<div class="wrap">
  <header>
    <h1 class="brand">Letter Ladder</h1>
    <div class="tagline">Add one letter, scramble to a new word, climb to the top.</div>
    <div class="top-links">
      <a href="about.html">How to play</a>
      <a href="solutions.html">Yesterday's solution</a>
      <a href="stats.html">Your stats</a>
    </div>
  </header>

  <div class="date-row" id="date-row"></div>

  <div class="tabs" id="tabs">
    <div class="tab" data-tier="easy">Easy</div>
    <div class="tab" data-tier="medium">Medium</div>
    <div class="tab" data-tier="hard">Hard</div>
  </div>

  <div class="panel" id="panel">
    <!-- filled by JS -->
  </div>

  <footer>
    Dictionary courtesy of the <a href="https://github.com/dwyl/english-words" target="_blank" style="color:var(--ink-dim)">dwyl/english-words</a> project on GitHub.
  </footer>
</div>

<!-- Bump the ?v= number below any time you update puzzles.js or the game logic,
     so returning visitors' browsers are guaranteed to fetch the new version
     instead of a cached copy. -->
<script src="data/words.js?v=1"></script>
<script src="data/puzzles.js?v=1785353564"></script>
<script src="data/hints.js?v=1785353564"></script>
<script>
// ---------- date helpers ----------
function todayKey(){
  const d = new Date();
  const y = d.getFullYear();
  const m = String(d.getMonth()+1).padStart(2,'0');
  const day = String(d.getDate()).padStart(2,'0');
  return `${y}-${m}-${day}`;
}
function prettyDate(key){
  const [y,m,d] = key.split('-').map(Number);
  const dt = new Date(y, m-1, d);
  return dt.toLocaleDateString(undefined, { weekday:'long', month:'long', day:'numeric' });
}

// ---------- game logic (ported from the original Flask app.py) ----------
function counter(str){
  const c = {};
  for(const ch of str) c[ch] = (c[ch]||0)+1;
  return c;
}
function timesText(n){
  if(n === 1) return 'once';
  if(n === 2) return 'twice';
  return `${n} times`;
}
function joinAnd(items){
  if(items.length === 1) return items[0];
  if(items.length === 2) return `${items[0]} and ${items[1]}`;
  return `${items.slice(0,-1).join(', ')}, and ${items[items.length-1]}`;
}
function lettersPhrase(letters){
  return letters.length === 1 ? `the letter ${letters[0]}` : `the letters ${joinAnd(letters)}`;
}
function checkGuessLetters(guess, startingWord, finalWord){
  const problems = [];

  const startingLetters = new Set(startingWord);
  const missingStarting = [...startingLetters].filter(ch => !guess.includes(ch));
  if(missingStarting.length > 0){
    problems.push({ reason:'missing_starting_letters', letters: missingStarting });
  }

  const guessCounter = counter(guess);
  const finalCounter = counter(finalWord);
  const notInFinal = [];
  const tooMany = [];
  for(const ch of Object.keys(guessCounter)){
    const gCount = guessCounter[ch];
    const fCount = finalCounter[ch] || 0;
    if(fCount === 0){
      notInFinal.push(ch);
    } else if(gCount > fCount){
      tooMany.push({ ch, fCount });
    }
  }
  if(notInFinal.length > 0){
    problems.push({ reason:'letter_not_in_final', letters: notInFinal });
  }
  if(tooMany.length > 0){
    problems.push({ reason:'too_many_repeats', details: tooMany });
  }
  return problems;
}
function isStepValid(word1, word2){
  if(word2.length !== word1.length + 1){
    return { valid:false, reason:'wrong_length' };
  }
  const counts1 = counter(word1);
  const counts2 = counter(word2);
  const missing = [];
  for(const ch of Object.keys(counts1)){
    const have = counts2[ch] || 0;
    if(have < counts1[ch]) missing.push(ch);
  }
  if(missing.length > 0){
    return { valid:false, reason:'missing_letters', letters: missing };
  }
  return { valid:true };
}
function isValidChain(startingWord, guessesObj, finalWord){
  const lengths = Object.keys(guessesObj).map(Number).sort((a,b)=>a-b);
  const allWords = [startingWord, ...lengths.map(l => guessesObj[l]), finalWord];
  const invalidSteps = [];
  for(let i=0;i<allWords.length-1;i++){
    const result = isStepValid(allWords[i], allWords[i+1]);
    if(!result.valid){
      invalidSteps.push({ from: allWords[i], to: allWords[i+1], ...result });
    }
  }
  return { valid: invalidSteps.length === 0, invalidSteps };
}

// ---------- state ----------
const TIERS = ['easy','medium','hard'];
let activeTier = 'easy';
let activeLength = null; // which rung (by word length) is currently being typed into
let lastEnterCommitAt = 0; // guards against iOS sometimes firing two separate
                            // "Enter was pressed" signals for one keypress
const dateKey = todayKey();

function storageKey(tier){ return `letterladder:${dateKey}:${tier}`; }
function loadGuesses(tier){
  try{
    const raw = localStorage.getItem(storageKey(tier));
    return raw ? JSON.parse(raw) : {};
  }catch(e){ return {}; }
}
function saveGuesses(tier, obj){
  try{ localStorage.setItem(storageKey(tier), JSON.stringify(obj)); }catch(e){}
}
function clearGuesses(tier){
  try{ localStorage.removeItem(storageKey(tier)); }catch(e){}
}

// ---------- stats, streaks & score (all local to this device/browser -
// there are no accounts, so none of this follows you to another device) ----------
const STATS_KEY = 'letterladder:stats';
const HINT_PENALTY_PER_USE = 5; // tweak this to make hints cost more/less

function blankStat(){
  return { played:0, solved:0, currentStreak:0, maxStreak:0, lastSolvedDate:null, score:0 };
}
function loadStats(){
  try{
    const raw = localStorage.getItem(STATS_KEY);
    if(raw){
      const parsed = JSON.parse(raw);
      // guard against a corrupted/partial object from an older version
      for(const key of ['easy','medium','hard','total']){
        parsed[key] = Object.assign(blankStat(), parsed[key] || {});
      }
      return parsed;
    }
  }catch(e){}
  return { easy: blankStat(), medium: blankStat(), hard: blankStat(), total: blankStat() };
}
function saveStats(stats){
  try{ localStorage.setItem(STATS_KEY, JSON.stringify(stats)); }catch(e){}
}
function dateKeyMinusOneDay(key){
  const [y,m,d] = key.split('-').map(Number);
  const dt = new Date(y, m-1, d);
  dt.setDate(dt.getDate()-1);
  return `${dt.getFullYear()}-${String(dt.getMonth()+1).padStart(2,'0')}-${String(dt.getDate()).padStart(2,'0')}`;
}
function bumpStreak(stat, todayKeyStr){
  if(stat.lastSolvedDate === todayKeyStr) return; // already counted today, don't double-bump
  const wasYesterday = stat.lastSolvedDate === dateKeyMinusOneDay(todayKeyStr);
  stat.currentStreak = wasYesterday ? stat.currentStreak + 1 : 1;
  stat.maxStreak = Math.max(stat.maxStreak, stat.currentStreak);
  stat.lastSolvedDate = todayKeyStr;
}

function markPlayedIfNeeded(tier){
  const flagKey = `letterladder:${dateKey}:${tier}:playedCounted`;
  if(localStorage.getItem(flagKey)) return;
  localStorage.setItem(flagKey, '1');
  const stats = loadStats();
  stats[tier].played += 1;
  stats.total.played += 1;
  saveStats(stats);
}

function recordHintUsed(tier){
  const key = `letterladder:${dateKey}:${tier}:hintsUsed`;
  const current = parseInt(localStorage.getItem(key) || '0', 10);
  localStorage.setItem(key, String(current + 1));
}
function getHintsUsed(tier){
  return parseInt(localStorage.getItem(`letterladder:${dateKey}:${tier}:hintsUsed`) || '0', 10);
}

function markSolvedIfNeeded(tier, guesses){
  const flagKey = `letterladder:${dateKey}:${tier}:solvedCounted`;
  if(localStorage.getItem(flagKey)) return;
  localStorage.setItem(flagKey, '1');

  const stats = loadStats();
  const stat = stats[tier];
  stat.solved += 1;
  stats.total.solved += 1;
  bumpStreak(stat, dateKey);

  // Score: reward the length of every word the person actually had to
  // guess (the start/final words are given to you, so they don't count),
  // minus a small penalty for each hint used on this specific puzzle.
  const guessedWords = Object.values(guesses);
  const basePoints = guessedWords.reduce((sum, w) => sum + w.length, 0);
  const penalty = getHintsUsed(tier) * HINT_PENALTY_PER_USE;
  stat.score += Math.max(0, basePoints - penalty);
  stats.total.score = stats.easy.score + stats.medium.score + stats.hard.score;

  // If this solve completes all three tiers for today, the "total" streak
  // (a separate concept from the per-tier ones - it tracks consecutive
  // days you completed EVERY puzzle, tying into the summit celebration)
  // gets its own bump.
  if(TIERS.every(isTierComplete)){
    bumpStreak(stats.total, dateKey);
  }

  saveStats(stats);
}

// ---------- rendering ----------
const panel = document.getElementById('panel');
document.getElementById('date-row').textContent = prettyDate(dateKey);

function getTodaysPuzzle(tier){
  const day = PUZZLE_SCHEDULE[dateKey];
  if(!day) return null;
  return day[tier] || null;
}

function isTierComplete(tier){
  const puzzle = getTodaysPuzzle(tier);
  if(!puzzle) return true; // no puzzle scheduled for this tier today - don't block the celebration on it
  const steps = [];
  for(let L = puzzle.start.length+1; L < puzzle.final.length; L++) steps.push(L);
  const guesses = loadGuesses(tier);
  if(!steps.every(L => guesses[L])) return false;
  const { valid } = isValidChain(puzzle.start, guesses, puzzle.final);
  return valid;
}

function triggerSummitCelebration(){
  const colors = ['#E8A33D', '#6FBF8B', '#F5EFE0', '#D9705F'];
  for(let i=0; i<70; i++){
    const piece = document.createElement('div');
    piece.className = 'confetti-piece';
    piece.style.left = (Math.random()*100) + 'vw';
    piece.style.background = colors[Math.floor(Math.random()*colors.length)];
    piece.style.animationDuration = (2.2 + Math.random()*1.6) + 's';
    piece.style.animationDelay = (Math.random()*0.4) + 's';
    document.body.appendChild(piece);
    setTimeout(()=> piece.remove(), 4200);
  }
  const banner = document.createElement('div');
  banner.className = 'summit-banner';
  banner.textContent = "Well done! You've reached the summit of today's letter ladder!";
  document.body.appendChild(banner);
  setTimeout(()=> banner.remove(), 4000);
}

function checkAndCelebrateIfAllComplete(){
  if(!TIERS.every(isTierComplete)) return;
  const flagKey = `letterladder:${dateKey}:summitShown`;
  if(localStorage.getItem(flagKey)) return;
  localStorage.setItem(flagKey, '1');
  triggerSummitCelebration();
}

function render(focusInput = false, pendingErrors = null){
  document.querySelectorAll('.tab').forEach(t=>{
    t.classList.toggle('active', t.dataset.tier === activeTier);
  });

  const puzzle = getTodaysPuzzle(activeTier);
  if(!puzzle){
    panel.className = 'panel';
    panel.innerHTML = `<div class="empty-state">No ${activeTier} puzzle scheduled for today yet — check back soon!</div>`;
    return;
  }

  const startingWord = puzzle.start;
  const finalWord = puzzle.final;
  const steps = [];
  for(let L = startingWord.length+1; L < finalWord.length; L++) steps.push(L);

  const guesses = loadGuesses(activeTier);
  const allFilled = steps.every(L => guesses[L]);
  let feedback = '';
  let feedbackClass = '';
  let details = [];

  if(allFilled){
    // Guarantee "played" is always counted before "solved" ever can be -
    // this covers puzzles that were already fully filled in from before
    // stats tracking existed, which would otherwise count as solved
    // without ever having been marked as played.
    markPlayedIfNeeded(activeTier);
    const { valid, invalidSteps } = isValidChain(startingWord, guesses, finalWord);
    if(valid){
      feedback = "🎉 You win! Nicely climbed.";
      feedbackClass = 'win';
      markSolvedIfNeeded(activeTier, guesses);
      checkAndCelebrateIfAllComplete();
    } else {
      feedback = "❌ Guesses aren't a valid progression.";
      feedbackClass = 'error';
      details = invalidSteps.map(s => {
        if(s.reason === 'missing_letters'){
          return `"${s.to.toUpperCase()}" is missing the "${s.letters.length === 1 ? s.letters[0].toUpperCase() : joinAnd(s.letters.map(l => l.toUpperCase()))}" from "${s.from.toUpperCase()}".`;
        }
        return `"${s.from.toUpperCase()}" → "${s.to.toUpperCase()}" isn't a valid one-letter step.`;
      });
    }
  }

  const isWon = feedbackClass === 'win';
  if(isWon) activeLength = null; // no more editing once solved

  let feedbackHtml = feedback;
  let feedbackClassFinal = feedbackClass;
  if(pendingErrors){
    feedbackHtml = `<div class="error-list-wrap"><ul class="error-list">${pendingErrors.map(e => `<li>${e}</li>`).join('')}</ul></div>`;
    feedbackClassFinal = 'error';
  }

  function rungWidthStyle(L){
    // Sized to that specific rung's own letter count (not a single blanket
    // size for the whole puzzle) so a 9-letter word gets a wider box than
    // a 4-letter one in the same puzzle, while still respecting the
    // size-tier's baseline minimum for short words.
    return `width:max(var(--rung-minw), calc(${L}ch + ${(L*0.08).toFixed(2)}em + 2.4em));`;
  }

  const rungsHtml = [];
  rungsHtml.push(`<div class="rung-row"><div class="rung-count">${finalWord.length}</div><div class="rung anchor" style="${rungWidthStyle(finalWord.length)}">${finalWord}</div></div>`);
  for(let i = steps.length-1; i>=0; i--){
    const L = steps[i];
    const g = guesses[L];
    if(!isWon && activeLength === L){
      rungsHtml.push(`<div class="rung-row"><div class="rung-count">${L}</div><input type="text" class="rung rung-input" id="rung-input-${L}" data-length="${L}" maxlength="${L}" value="${g ? g : ''}" style="${rungWidthStyle(L)}" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" enterkeyhint="done"></div>`);
    } else {
      const clickableClass = isWon ? '' : 'clickable';
      rungsHtml.push(`<div class="rung-row"><div class="rung-count">${L}</div><div class="rung ${g?'':'empty'} ${clickableClass}" data-length="${L}" style="${rungWidthStyle(L)}">${g ? g : '&nbsp;'.repeat(L)}</div></div>`);
    }
  }
  rungsHtml.push(`<div class="rung-row"><div class="rung-count">${startingWord.length}</div><div class="rung anchor" style="${rungWidthStyle(startingWord.length)}">${startingWord}</div></div>`);

  const totalRungs = steps.length + 2;
  let sizeTier = '';
  if(totalRungs >= 9) sizeTier = 'rungs-xl';
  else if(totalRungs >= 7) sizeTier = 'rungs-lg';
  else if(totalRungs >= 5) sizeTier = 'rungs-md';

  panel.className = `panel ${sizeTier}`;
  panel.innerHTML = `
    <div class="level-label">${activeTier} puzzle</div>
    <div class="ladder-scroll" id="ladder-scroll"><div class="ladder">${rungsHtml.join('')}</div></div>
    <div class="feedback ${feedbackClassFinal}">${feedbackHtml}</div>
    ${details.map(d=>`<div class="details">${d}</div>`).join('')}
    <div class="actions-row">
      <button class="btn-ghost" id="clear-btn" type="button">Clear guesses</button>
      ${isWon ? '' : `<button class="btn-ghost" id="hint-btn" type="button">Hint</button>`}
    </div>
    <div class="hint-display" id="hint-display"></div>
  `;

  document.getElementById('clear-btn').addEventListener('click', ()=>{
    activeLength = null;
    clearGuesses(activeTier);
    render();
  });

  const hintBtn = document.getElementById('hint-btn');
  if(hintBtn){
    hintBtn.addEventListener('click', ()=>{
      const hintDisplay = document.getElementById('hint-display');
      const unfilled = steps.filter(L => !guesses[L]);
      if(unfilled.length === 0){
        hintDisplay.innerHTML = `Every rung is already filled in!`;
        return;
      }
      const targetLength = Math.max(...unfilled);
      const dayHints = (typeof HINTS_SCHEDULE !== 'undefined' && HINTS_SCHEDULE[dateKey]) || null;
      const tierHint = dayHints ? dayHints[activeTier] : null;
      const targetWord = tierHint ? tierHint.solution.find(w => w.length === targetLength) : null;

      if(!targetWord){
        hintDisplay.innerHTML = `No hint available for this puzzle yet.`;
        return;
      }
      const letters = joinAnd(targetWord.split('').sort().map(ch => ch.toUpperCase()));
      hintDisplay.innerHTML = `${targetLength}-letter word uses: <span class="hint-letters">${letters}</span>`;
      recordHintUsed(activeTier);
    });
  }

  if(!isWon){
    panel.querySelectorAll('.rung.clickable').forEach(el => {
      el.addEventListener('click', ()=>{
        activeLength = Number(el.dataset.length);
        render(true);
      });
    });
  }

  let activeInput = null;
  if(!isWon && activeLength != null){
    activeInput = document.getElementById(`rung-input-${activeLength}`);
  }

  if(activeInput){
    if(focusInput){
      activeInput.focus({ preventScroll: true });
      activeInput.select();
      activeInput.scrollIntoView({ block: 'nearest' });
    }

    let lastNonEmptyValue = activeInput.value || '';
    let committed = false;
    function commit(viaEnter){
      if(committed) return;
      committed = true;

      const L = activeLength;
      let liveValue = activeInput.value;
      // On some iPhones, the field's value can appear to already be
      // cleared by the moment an Enter-style submit is processed (before
      // our code gets to read it), which would otherwise look identical
      // to an abandoned/empty attempt and silently close with no error.
      // Fall back to the last thing they actually typed in that case.
      if(viaEnter && (!liveValue || liveValue.trim() === '') && lastNonEmptyValue){
        liveValue = lastNonEmptyValue;
      }
      const raw = liveValue.replace(/\s+/g,'').toLowerCase().slice(0, L);

      if(raw === ''){
        if(pendingErrors){
          // This box was reopened specifically to show an error (from an
          // earlier Enter-triggered submit). If it blurs away untouched
          // before the person retypes anything, don't silently wipe that
          // error off the screen - keep it visible.
          activeLength = null;
          render(false, pendingErrors);
          return;
        }
        // Nothing typed (or it was cleared) - just close without changing
        // anything, no error needed for an abandoned/empty attempt.
        activeLength = null;
        render();
        return;
      }

      markPlayedIfNeeded(activeTier);
      const errs = [];

      if(raw.length !== L){
        errs.push(`Guess must be ${L} letters long.`);
      }

      if(!/^[a-z]+$/.test(raw)){
        errs.push("Guess must be letters only.");
      } else {
        if(!WORD_SET.has(raw)) errs.push("Not a valid English word.");
        const letterProblems = checkGuessLetters(raw, startingWord, finalWord);
        for(const problem of letterProblems){
          if(problem.reason === 'missing_starting_letters'){
            errs.push(`Guess doesn't include every letter from the starting word: ${joinAnd(problem.letters.map(l => l.toUpperCase()))}`);
          } else if(problem.reason === 'letter_not_in_final'){
            const isPlural = problem.letters.length > 1;
            errs.push(`Guess uses ${isPlural ? "letters that aren't" : "a letter that isn't"} in the final word: ${joinAnd(problem.letters.map(l => l.toUpperCase()))}`);
          } else if(problem.reason === 'too_many_repeats'){
            const parts = problem.details.map(d => `"${d.ch.toUpperCase()}" too many times — it's only in the final word ${timesText(d.fCount)}`);
            errs.push(`Guess uses ${parts.join('; ')}.`);
          }
        }
      }

      if(errs.length > 0){
        activeInput.value = '';
        if(viaEnter){
          // An explicit submit attempt - keep this rung open so they can
          // fix it right away.
          render(true, errs);
        } else {
          // Tapped away instead of pressing Enter (this is actually the
          // common case on mobile, where the keyboard's "Return"/"Go" key
          // often just blurs the field rather than firing a proper Enter
          // key event). Still show the error - just don't force focus
          // back, since they may have deliberately tapped somewhere else.
          activeLength = null;
          render(false, errs);
        }
        return;
      }

      const newGuesses = loadGuesses(activeTier);
      newGuesses[L] = raw;
      saveGuesses(activeTier, newGuesses);

      // No auto-advance - the person always has to click into whichever
      // box they want to guess next, on purpose.
      activeLength = null;
      render();
    }

    function tryCommitViaEnter(){
      const now = Date.now();
      if(now - lastEnterCommitAt < 700) return; // a duplicate signal for the
                                                 // same keypress - ignore it
      lastEnterCommitAt = now;
      commit(true);
    }

    activeInput.addEventListener('keydown', (e)=>{
      if(e.key === 'Enter'){ e.preventDefault(); tryCommitViaEnter(); }
    });
    activeInput.addEventListener('input', (e)=>{
      if(activeInput.value && activeInput.value.trim() !== ''){
        lastNonEmptyValue = activeInput.value;
      }
      // Mobile keyboards don't always fire a proper keydown for
      // Return/Go on a plain input - but the 'input' event's inputType
      // reliably reflects it when they do commit a line break, so this
      // catches Enter presses that keydown alone might miss. The debounce
      // above keeps this from double-firing alongside keydown for the
      // exact same keypress.
      if(e.inputType === 'insertLineBreak'){ tryCommitViaEnter(); }
    });
    activeInput.addEventListener('blur', ()=> commit(false));
  }

  const ladderScroll = document.getElementById('ladder-scroll');
  if(ladderScroll && activeInput){
    let wasFocused = false;
    let refocusTimer = null;
    ladderScroll.addEventListener('touchstart', ()=>{
      wasFocused = document.activeElement === activeInput;
    }, { passive: true });
    ladderScroll.addEventListener('scroll', ()=>{
      if(!wasFocused) return;
      clearTimeout(refocusTimer);
      refocusTimer = setTimeout(()=>{
        if(document.activeElement !== activeInput){
          activeInput.focus({ preventScroll: true });
        }
      }, 120);
    }, { passive: true });
  }
}

document.getElementById('tabs').addEventListener('click', (e)=>{
  const tab = e.target.closest('.tab');
  if(!tab) return;
  activeTier = tab.dataset.tier;
  activeLength = null;
  render();
});

render();

</script>
</body>
</html>
